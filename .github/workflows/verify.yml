name: Validate challenges

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out challenges
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test format validation
        run: python3 -B -m unittest discover -s tools -p 'test_*.py'
      - name: Validate every challenge
        run: python3 tools/validate.py
