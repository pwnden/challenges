schema = 7
slug = "backup-relay"
title = "백업 중계기의 연결 상태"
category = "misc"
difficulty = 2
compose = "compose.yaml"

[player]
tools = ["terminal"]
cli = ["ncat"]

[learning]
requires = ["terminal-commands", "tcp-services"]
teaches = ["connection-state"]

[content]
description = "README.md"
hints = ["hints/1.md", "hints/2.md"]
walkthrough = "solve/README.md"

[flag]
mode = "generated"

[[endpoints]]
name = "relay"
service = "app"
port = 9000
protocol = "tcp"

[solve]
image = "pwnden-cli:basic-20261003"
command = ["python3", "solve/solve.py"]
timeout_seconds = 30

[patched]
compose = "compose.patched.yaml"
check = ["bash", "patched/test.sh"]
