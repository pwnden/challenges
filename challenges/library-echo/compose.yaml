services:
  app:
    platform: linux/amd64
    build:
      context: .
      dockerfile: vulnerable/Dockerfile
    environment:
      FLAG: ${FLAG:?Start with the pwnden runner}
    networks: [default]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    init: true
    healthcheck:
      test: [CMD, python3, -c, "import socket; socket.create_connection(('127.0.0.1', 9400), timeout=2).close()"]
      interval: 2s
      timeout: 3s
      retries: 15
networks:
  default:
    internal: true
