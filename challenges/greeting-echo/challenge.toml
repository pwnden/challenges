schema = 7
slug = "greeting-echo"
title = "안내 로봇의 메아리 기능"
category = "pwn"
difficulty = 3
files = ["files/kiosk"]
compose = "compose.yaml"

[player]
tools = ["files", "terminal"]
cli = ["ncat", "objdump", "python3"]

[learning]
requires = ["memory-layout", "terminal-commands"]
teaches = ["return-address-control"]

[content]
description = "README.md"
hints = ["hints/1.md", "hints/2.md", "hints/3.md"]
walkthrough = "solve/README.md"

[flag]
mode = "generated"

[[endpoints]]
name = "kiosk"
service = "app"
port = 9200
protocol = "tcp"

[solve]
image = "pwnden-cli:basic-20261014"
command = ["python3", "solve/solve.py"]
timeout_seconds = 30

[patched]
compose = "compose.patched.yaml"
check = ["python3", "patched/test.py"]
