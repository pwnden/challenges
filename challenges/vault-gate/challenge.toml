schema = 7
slug = "vault-gate"
title = "방문자 접수대의 입력 한계"
category = "pwn"
difficulty = 2
files = ["files/vault"]
compose = "compose.yaml"

[player]
tools = ["files", "terminal"]
cli = ["ncat", "objdump"]

[learning]
requires = ["terminal-commands", "program-reading"]
teaches = ["memory-layout"]

[content]
description = "README.md"
hints = ["hints/1.md", "hints/2.md"]
walkthrough = "solve/README.md"

[flag]
mode = "generated"

[[endpoints]]
name = "vault"
service = "app"
port = 9100
protocol = "tcp"

[solve]
image = "pwnden-cli:basic-20261014"
command = ["python3", "solve/solve.py"]
timeout_seconds = 30

[patched]
compose = "compose.patched.yaml"
check = ["python3", "patched/test.py"]
