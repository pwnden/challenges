schema = 7
slug = "export-gap"
title = "내보내기에서 빠진 권한 검사"
category = "web"
difficulty = 2
compose = "compose.yaml"

[player]
tools = ["terminal"]
cli = ["curl", "jq"]

[learning]
requires = ["terminal-commands","http-messages","http-cookies","curl-json","object-ownership"]
teaches = ["read-path-authorization"]

[content]
description = "README.md"
hints = ["hints/1.md", "hints/2.md"]
walkthrough = "solve/README.md"

[flag]
mode = "generated"

[[endpoints]]
name = "api"
service = "app"
port = 8000
protocol = "http"

[solve]
image = "pwnden-cli:basic-20261003"
command = ["bash", "solve/solve.sh"]
writable = true
timeout_seconds = 30

[patched]
compose = "compose.patched.yaml"
check = ["bash", "patched/test.sh"]
