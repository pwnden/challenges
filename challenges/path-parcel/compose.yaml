services:
  app:
    build:
      context: ../..
      dockerfile: challenges/path-parcel/vulnerable/Dockerfile
    environment:
      FLAG: ${FLAG:?Start this challenge with the pwnden runner}
    networks: ["default"]
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    init: true
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2).read()"]
      interval: 2s
      timeout: 3s
      retries: 15

networks:
  "default":
    internal: true
