schema = 7
slug = "night-console"
title = "야간 진단 콘솔의 메모 기능"
category = "pwn"
difficulty = 4
files = ["files/console"]
compose = "compose.yaml"

[player]
tools = ["files", "terminal"]
cli = ["ncat", "objdump", "python3"]

[learning]
requires = ["return-address-control", "tcp-services", "terminal-commands"]
teaches = ["argument-call-chains"]

[content]
description = "README.md"
hints = ["hints/1.md", "hints/2.md", "hints/3.md"]
walkthrough = "solve/README.md"

[flag]
mode = "generated"

[[endpoints]]
name = "console"
service = "app"
port = 9300
protocol = "tcp"

[solve]
image = "pwnden-cli:basic-20261014"
command = ["python3", "solve/solve.py"]
timeout_seconds = 30

[patched]
compose = "compose.patched.yaml"
check = ["python3", "patched/test.py"]
